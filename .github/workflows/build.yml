name: Build VST3
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: nuget/setup-nuget@v2
      - name: Get WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory webview2pkg
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/webview2pkg"
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: SISSHIN-HZ-MACHINE-VST3
          path: build/HZMachine_artefacts/Release/VST3/
